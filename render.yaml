services:
  - type: web
    name: ip-geolocation-api
    runtime: python
    buildCommand: pip install -r requirements.txt && chmod +x start.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_BASE_URL
        value: https://ip-geolocation-api-31u6.onrender.com
      - key: MAXMIND_LICENSE_KEY
        sync: false
